[package]
name = "rtl_pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rustfft = "6"
crc16 = "0.4"
chrono = "0.4"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "1.1"

[profile.release]
debug = true
